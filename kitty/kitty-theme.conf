# vim:ft=kitty

# --- Oxocarbon Kitty Color Scheme ---

# The basic colors
background #161616
foreground #d2d2d2

# Selection colors
selection_background #393939
selection_foreground #ffffff

# Cursor
cursor #ffffff
cursor_text_color #161616

# URL underline color when hovering with mouse
url_color #be95ff

# Kitty window border colors
active_border_color #be95ff
inactive_border_color #262626
bell_border_color #ee5396

# Tab bar colors
active_tab_background #161616
active_tab_foreground #ffffff
inactive_tab_background #262626
inactive_tab_foreground #8d8d8d
tab_bar_background #161616

# Normal colors (matching terminal_color_0 to 7)
color0 #262626
color1 #33b1ff
color2 #be95ff
color3 #42be65
color4 #78a9ff
color5 #82cfff
color6 #3ddbd9
color7 #dfdfdf

# Bright colors (matching terminal_color_8 to 15)
color8 #393939
color9 #33b1ff
color10 #be95ff
color11 #42be65
color12 #78a9ff
color13 #82cfff
color14 #08bdba
color15 #ffffff
